# Build bản chạy production trên Linux rồi đẩy vào nhánh `deploy`.
# Server cPanel không build được Next.js (glibc quá cũ cho trình biên dịch SWC),
# nên server chỉ cần: git fetch origin deploy && git reset --hard origin/deploy && restart.
#
# Ba job: `test` và `build` chạy song song; `publish` chỉ đẩy lên nhánh deploy khi cả hai đều xanh.
name: Build deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache build của Next.js: các lần sau chỉ biên dịch phần đã đổi
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Không thử lại: lỗi build phải được sửa, không chạy lại cho mất thời gian
      - name: Build
        run: npm run build

      - name: Assemble deploy bundle
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/deploy"
          mkdir -p "$OUT"
          cp -a .next/standalone "$OUT/standalone"
          # Thư mục app nằm trong document root của tên miền: chặn tải trực tiếp mã đã build qua HTTP.
          # Next.js đọc file từ ổ đĩa nên không bị ảnh hưởng.
          printf 'Require all denied\n' > "$OUT/standalone/.htaccess"
          cat > "$OUT/server.cjs" <<'EOF'
          // cPanel Application Startup File (nhánh deploy). Cấu hình nằm trong biến môi trường của cPanel.
          const path = require('node:path');
          process.env.HOSTNAME = process.env.DANAVA_HOSTNAME || '0.0.0.0';
          process.env.DANAVA_DATA_DIR = process.env.DANAVA_DATA_DIR || path.join(__dirname, '.data');
          require('./standalone/server.js');
          EOF
          printf '{\n  "name": "danava-company-website-deploy",\n  "private": true,\n  "main": "server.cjs"\n}\n' > "$OUT/package.json"
          printf '.data/\n.env\ntmp/\nnode_modules\n!standalone/node_modules\n' > "$OUT/.gitignore"
          echo "Built from ${GITHUB_SHA} at $(date -u +%FT%TZ)" > "$OUT/BUILD.txt"
          cp deploy.sh "$OUT/deploy.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: ${{ runner.temp }}/deploy
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: deploy

      - name: Push to deploy branch
        run: |
          set -euo pipefail
          cd deploy
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:deploy
